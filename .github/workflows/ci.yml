name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run fmt:check

      - name: Type-check
        run: pnpm run type-check

      - name: Test (runtime)
        run: pnpm run test:run

      - name: Test (types)
        run: pnpm run test:types

      - name: Build
        run: pnpm run build

      - name: SDK dist self-contained (no auth-contracts import)
        run: pnpm --filter @eva_solutions/auth-sdk run check:self-contained

      - name: Contracts subpath loads as ESM and CJS
        run: |
          node --input-type=module -e "const m=await import('./packages/auth-sdk/dist/contracts/index.js');if(!m.AUTH_ROUTES||!m.loginRequestSchema)process.exit(1)"
          node -e "const m=require('./packages/auth-sdk/dist/contracts/index.cjs');if(!m.AUTH_ROUTES||!m.loginRequestSchema)process.exit(1)"

      - name: React entry closure, ESM and CJS (size cap + no schema modules)
        run: pnpm --filter @eva_solutions/auth-sdk run check:react-closure

      - name: No console.log/debug in runtime (AST-aware)
        run: pnpm exec oxlint -D no-console --ignore-pattern '**/*.test.ts' --ignore-pattern '**/*.test-d.ts' --ignore-pattern '**/__tests__/**' packages/auth-sdk/src/ packages/auth-contracts/src/

  publish-dryrun:
    name: Publish dry-run
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack (dry-run)
        working-directory: packages/auth-sdk
        run: npm pack --dry-run
